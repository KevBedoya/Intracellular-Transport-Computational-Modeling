<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intracellular transport — compute</title>
<style>
  /* Palette: validated categorical slots plus neutral chrome. Light and dark
     are both selected rather than one being an inverted guess. */
  :root {
    color-scheme: light;
    --surface: #fcfcfb;  --panel: #ffffff;  --plane: #f4f4f1;
    --ink: #0b0b0b;      --ink-2: #52514e;  --muted: #898781;
    --line: #e1e0d9;     --rule: #c3c2b7;
    --accent: #2a78d6;   --accent-ink: #ffffff;
    --good: #0ca30c;     --warn: #fab219;   --bad: #d03b3b;  --run: #eb6834;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface: #1a1a19; --panel: #232322;  --plane: #0d0d0d;
      --ink: #ffffff;     --ink-2: #c3c2b7;  --muted: #898781;
      --line: #2c2c2a;    --rule: #383835;
      --accent: #3987e5;  --accent-ink: #ffffff;
      --good: #0ca30c;    --warn: #fab219;   --bad: #e66767;  --run: #d95926;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--plane); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 18px; background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .spacer { flex: 1; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-size: 12px; padding: 2px 8px; border-radius: 999px;
    background: var(--plane); border: 1px solid var(--line); color: var(--ink-2);
  }
  main {
    display: grid; grid-template-columns: minmax(340px, 420px) 1fr;
    gap: 14px; padding: 14px; align-items: start;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 14px;
  }
  .card h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); margin: 0 0 10px; font-weight: 650;
  }
  label { display: block; font-size: 12.5px; color: var(--ink-2); margin-bottom: 3px; }
  .req::after { content: " *"; color: var(--bad); }
  input, select, textarea, button {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px;
    width: 100%;
  }
  input[type=checkbox] { width: auto; }
  .field { margin-bottom: 10px; }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .err { font-size: 11.5px; color: var(--bad); margin-top: 3px; display: none; }
  .field.bad input, .field.bad select { border-color: var(--bad); }
  .field.bad .err { display: block; }
  .check { font-size: 11.5px; margin-top: 3px; }
  .check:empty { display: none; }
  .check.ok  { color: var(--good); }
  .check.bad { color: var(--bad); font-weight: 600; }
  .check.idle { color: var(--muted); }
  .field.dbad input { border-color: var(--bad); }
  button.primary {
    background: var(--accent); color: var(--accent-ink);
    border-color: transparent; font-weight: 600; cursor: pointer; padding: 9px;
  }
  button.primary[disabled] { opacity: .45; cursor: not-allowed; }
  button.mini {
    width: auto; padding: 3px 9px; font-size: 12px; cursor: pointer;
    background: var(--plane);
  }
  details { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
  details summary {
    cursor: pointer; font-size: 12.5px; color: var(--ink-2); font-weight: 600;
  }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row > * { flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; font-size: 11.5px; text-transform: uppercase;
    letter-spacing: .04em; color: var(--muted); font-weight: 650;
    border-bottom: 1px solid var(--rule); padding: 5px 6px;
  }
  td { padding: 5px 6px; border-bottom: 1px solid var(--line); }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--plane); }
  tbody tr.sel { background: color-mix(in oklab, var(--accent) 12%, transparent); }
  .st { font-size: 11.5px; font-weight: 650; }
  .st-queued { color: var(--muted); }
  .st-running { color: var(--run); }
  .st-succeeded { color: var(--good); }
  .st-failed { color: var(--bad); }
  .st-cancelled { color: var(--muted); }
  .est {
    font-size: 12.5px; padding: 8px 10px; border-radius: 6px;
    background: var(--plane); border: 1px solid var(--line); margin: 10px 0;
  }
  .est.heavy { border-color: var(--warn); }
  .banner {
    font-size: 12.5px; padding: 8px 10px; border-radius: 6px; margin-bottom: 10px;
    display: none; white-space: pre-wrap;
  }
  .banner.ok  { display: block; background: color-mix(in oklab, var(--good) 14%, transparent); }
  .banner.bad { display: block; background: color-mix(in oklab, var(--bad) 14%, transparent); }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  /* tabular figures so a ticking value does not change the column width every
     second, which would reflow the table under the reader */
  td.mono { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.overdue { color: var(--warn); }
  .files { list-style: none; padding: 0; margin: 0; }
  .files li {
    display: flex; gap: 8px; align-items: center; padding: 4px 0;
    border-bottom: 1px solid var(--line); font-size: 12.5px;
  }
  .files a { color: var(--accent); }
  .files .sz { color: var(--muted); font-size: 11.5px; margin-left: auto; }
  .preview { margin-top: 10px; }
  .preview img {
    max-width: 100%; border: 1px solid var(--line); border-radius: 6px;
    background: #fff;
  }
  .kv { font-size: 12.5px; }
  .kv div { display: flex; gap: 8px; padding: 2px 0; }
  .kv span:first-child { color: var(--muted); min-width: 150px; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 8px 0; }
  .note {
    font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line);
    margin-top: 12px; padding-top: 8px;
  }
</style>
</head>
<body>
<header>
  <h1>Intracellular transport — compute</h1>
  <span class="chip"><span class="dot" id="healthDot"></span> <span id="healthText">connecting…</span></span>
  <div class="chips" id="queueChips"></div>
  <span class="spacer"></span>
</header>

<main>
  <section class="card" id="launch">
    <h2>Launch a job</h2>
    <div class="banner" id="banner"></div>

    <div class="field">
      <label for="comp">Computation</label>
      <select id="comp"><option value="">loading…</option></select>
      <div class="hint" id="compApproach"></div>
    </div>

    <form id="form" autocomplete="off"></form>
    <div class="est" id="est" hidden></div>
    <button class="primary" id="submit" disabled>Queue job</button>
    <div class="note" id="authNote"></div>
  </section>

  <div>
    <section class="card" style="margin-bottom:14px">
      <h2>Queue</h2>
      <table>
        <thead><tr>
          <th>Job</th><th>Computation</th><th>Grid</th>
          <th>Status</th><th>Elapsed</th><th>Remaining</th><th></th>
        </tr></thead>
        <tbody id="jobs"><tr><td colspan="7" class="empty">loading…</td></tr></tbody>
      </table>
    </section>

    <section class="card" id="detailCard">
      <h2>Job detail</h2>
      <div id="detail"><div class="empty">Select a job above.</div></div>
    </section>
  </div>
</main>

<script src="{{ url_for('static', filename='ui.js') }}"></script>
</body>
</html>
